<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeAlpha - Music Player</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="player-container">
      <!-- Album Art & Song Info -->

      <header class="page-header">
        <h1>AUDIO PLAYER</h1>
        <hr />
      </header>

      <div class="album-art">
        <img id="coverImg" src="https://picsum.photos" alt="Album Cover" />
      </div>

      <div class="song-details">
        <h2 id="songTitle">Loading...</h2>
        <p id="songArtist">Artist</p>
      </div>

      <!-- Progress Bar & Duration -->
      <div class="progress-section">
        <div class="time-stamps">
          <span id="currentTime">0:00</span>
          <span id="totalDuration">0:00</span>
        </div>
        <input
          type="range"
          id="progressBar"
          value="0"
          min="0"
          max="100"
          step="0.1"
        />
      </div>

      <!-- Main Playback Controls -->
      <div class="controls">
        <button id="prevBtn" class="control-btn" title="Previous">
          &#9198;
        </button>
        <button
          id="playPauseBtn"
          class="control-btn play-btn"
          title="Play/Pause"
        >
          &#9654;
        </button>
        <button id="nextBtn" class="control-btn" title="Next">&#9197;</button>
      </div>

      <!-- Volume & Autoplay Controls -->
      <div class="extra-controls">
        <div class="volume-box">
          <span>&#128266;</span>
          <input
            type="range"
            id="volumeSlider"
            min="0"
            max="1"
            step="0.05"
            value="0.8"
          />
        </div>

        <label class="autoplay-toggle">
          <input type="checkbox" id="autoplayCheckbox" checked />
          <span>Autoplay</span>
        </label>
      </div>

      <!-- Bonus: Playlist -->
      <div class="playlist-section">
        <h3>Playlist</h3>
        <ul id="playlistList"></ul>
      </div>

      <h6>By Akshay Dasila</h6>
    </div>

    <!-- Hidden HTML5 Audio Element -->
    <audio id="audioPlayer"></audio>

    <script src="script.js"></script>
  </body>
</html>
