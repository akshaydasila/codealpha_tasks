<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Image Gallery</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="gallery-header">
      <h1>My Gallery</h1>
      <p>Filter by category or click any photo to view in full screen.</p>

      <!-- Bonus: Category Filter Buttons -->
      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="nature">Nature</button>
        <button class="filter-btn" data-filter="architecture">
          Architecture
        </button>
        <button class="filter-btn" data-filter="travel">Travel</button>
      </div>
    </header>

    <!-- Image Grid -->
    <main class="gallery-grid">
      <div class="gallery-item" data-category="nature">
        <img src="./PHOTOS/mountain_valley.png" alt="Mountain Valley" />
        <div class="overlay"><span>Mountain Valley</span></div>
      </div>

      <div class="gallery-item" data-category="architecture">
        <img src="./PHOTOS/collosum.png" alt="Colloseum" />
        <div class="overlay"><span>Colloseum</span></div>
      </div>

      <div class="gallery-item" data-category="travel">
        <img src="./PHOTOS/indonesia.png" alt="Indonesia" />
        <div class="overlay"><span>Indonesia</span></div>
      </div>

      <div class="gallery-item" data-category="nature">
        <img src="./PHOTOS/river.png" alt="River Canyon" />
        <div class="overlay"><span>River Canyon</span></div>
      </div>

      <div class="gallery-item" data-category="architecture">
        <img src="./PHOTOS/machu_pichu.png" alt="Machu Pichu" />
        <div class="overlay"><span>Machu Pichu</span></div>
      </div>

      <div class="gallery-item" data-category="travel">
        <img src="./PHOTOS/japan.png" alt="Japan" />
        <div class="overlay"><span>Japan</span></div>
      </div>

      <div class="gallery-item" data-category="nature">
        <img src="./PHOTOS/valley.png" alt="Valley" />
        <div class="overlay"><span>Valley</span></div>
      </div>

      <div class="gallery-item" data-category="architecture">
        <img src="./PHOTOS/sagrada.png" alt="Sagrada" />
        <div class="overlay"><span>Sagrada</span></div>
      </div>

      <div class="gallery-item" data-category="travel">
        <img src="./PHOTOS/kashmir.png" alt="Kashmir" />
        <div class="overlay"><span>Kashmir</span></div>
      </div>

      <div class="gallery-item" data-category="nature">
        <img src="./PHOTOS/snow_cabin.png" alt="Snow" />
        <div class="overlay"><span>Snow</span></div>
      </div>

      <div class="gallery-item" data-category="architecture">
        <img src="./PHOTOS/taj_mahal.png" alt="Tajmahal" />
        <div class="overlay"><span>Taj Mahal</span></div>
      </div>

      <div class="gallery-item" data-category="travel">
        <img src="./PHOTOS/greece.png" alt="Greece" />
        <div class="overlay"><span>Greece</span></div>
      </div>
    </main>

    <!-- Lightbox Modal -->
    <div class="lightbox" id="lightbox">
      <button class="close-btn" id="closeBtn" aria-label="Close">
        &times;
      </button>
      <button class="nav-btn prev-btn" id="prevBtn" aria-label="Previous">
        &#10094;
      </button>

      <div class="lightbox-content">
        <img id="lightboxImg" src="" alt="Expanded View" />
        <p id="lightboxCaption"></p>
      </div>

      <button class="nav-btn next-btn" id="nextBtn" aria-label="Next">
        &#10095;
      </button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
